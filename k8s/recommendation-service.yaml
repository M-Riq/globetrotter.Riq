apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: globetrotter
  labels:
    app: recommendation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: globetrotter/recommendation-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: globetrotter-secrets, key: JWT_SECRET_KEY}
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef: {name: globetrotter-config, key: CORS_ORIGINS}
        - name: FLASK_DEBUG
          valueFrom:
            configMapKeyRef: {name: globetrotter-config, key: FLASK_DEBUG}
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef: {name: globetrotter-config, key: USER_SERVICE_URL}
        - name: DESTINATION_SERVICE_URL
          valueFrom:
            configMapKeyRef: {name: globetrotter-config, key: DESTINATION_SERVICE_URL}
          readinessProbe:
            httpGet: {path: /health, port: 5004}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5004}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: globetrotter
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 5004
      targetPort: 5004
  type: ClusterIP
